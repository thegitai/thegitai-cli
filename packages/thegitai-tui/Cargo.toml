[package]
name = "thegitai-tui"
version = "0.1.0"
edition = "2021"
description = "Ratatui terminal renderer for TheGitAI"
license = "UNLICENSED"

[[bin]]
name = "thegitai-tui"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
crossterm = "0.28"
# unstable-rendered-line-info exposes Paragraph::line_count, used to reserve the
# exact number of rows the wrapped composer needs (see render.rs section_height).
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# macOS-only: re-point stdin at the controlling pts so crossterm's input reader
# doesn't fall back to /dev/tty, which macOS kqueue cannot register. See main.rs.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }
